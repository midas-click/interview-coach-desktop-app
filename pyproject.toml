[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "interview-transcriber"
version = "0.1.0"
description = "Windows desktop application for real-time interview transcription"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "PySide6>=6.7",
    "faster-whisper>=1.0",
    "PyAudio>=0.2.14",
    "boto3>=1.34",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "qasync>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
